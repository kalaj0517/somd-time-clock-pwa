<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#cd9934">
  <title>SOMD Time Clock</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    :root {
      --gold: #cd9934;
      --gold-dark: #b8862e;
      --gold-light: #daa842;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafafa;
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      color: white;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(205, 153, 52, 0.3);
    }

    .header h1 { font-size: 26px; font-weight: 600; margin-bottom: 6px; }
    .header p { font-size: 14px; opacity: 0.95; }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      border: 1px solid rgba(205, 153, 52, 0.1);
    }

    #timeDisplay {
      font-size: 52px;
      text-align: center;
      font-weight: 700;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    #status {
      padding: 16px;
      margin-bottom: 20px;
      font-weight: 600;
      border-radius: 14px;
      text-align: center;
      font-size: 15px;
    }
    .ok { background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); color: #1b5e20; }
    .err { background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%); color: #b71c1c; }
    .warn { background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%); color: #e65100; }

    .offline-badge {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      color: white;
      padding: 14px 24px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 18px;
      box-shadow: 0 6px 20px rgba(238, 90, 111, 0.4);
    }

    .employee-badge {
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
      color: white;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(205, 153, 52, 0.3);
    }

    .employee-badge h3 { font-size: 18px; margin-bottom: 4px; }
    .employee-badge p { font-size: 13px; opacity: 0.9; }
    .employee-badge button {
      background: white;
      color: var(--gold);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
      cursor: pointer;
    }

    #employeeSetup {
      background: white;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      text-align: center;
      border: 2px solid rgba(205, 153, 52, 0.2);
    }

    #employeeSetup h3 { color: var(--gold); margin-bottom: 12px; font-size: 22px; }
    #employeeSetup p { color: #666; margin-bottom: 16px; }
    #employeeSetup select {
      width: 100%;
      padding: 16px;
      border: 2px solid #e8e8e8;
      border-radius: 14px;
      font-size: 16px;
      margin-bottom: 16px;
      background: #fafafa;
    }
    #employeeSetup button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 17px;
    }

    label {
      font-weight: 600;
      margin-top: 18px;
      margin-bottom: 8px;
      display: block;
      color: #444;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, input, textarea {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: 2px solid #e8e8e8;
      font-size: 16px;
      transition: all 0.3s;
      background: #fafafa;
    }

    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(205, 153, 52, 0.1);
      background: white;
    }

    button {
      width: 100%;
      padding: 18px;
      margin-top: 18px;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 17px;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:active { transform: scale(0.97); }

    .clockInBtn {
      background: linear-gradient(135deg, #2e7d32 0%, #43a047 100%);
      box-shadow: 0 6px 20px rgba(46, 125, 50, 0.35);
    }

    .clockOutBtn {
      background: linear-gradient(135deg, #c62828 0%, #e53935 100%);
      box-shadow: 0 6px 20px rgba(198, 40, 40, 0.35);
    }

    .myTimesBtn {
      background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 100%);
      box-shadow: 0 6px 20px rgba(205, 153, 52, 0.35);
    }

    .clientInfoBtn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold);
      width: auto;
      padding: 6px;
      margin: 0;
    }

    .input-wrapper { position: relative; }

    #clientPopup {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    #clientPopup .popupCard {
      background: white;
      padding: 28px;
      width: 90%;
      max-width: 420px;
      border-radius: 24px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.3);
    }

    .loading {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(205, 153, 52, 0.3);
      border-radius: 50%;
      border-top-color: var(--gold);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>💛 SOMD Home Health</h1>
    <p>Compassionate Care • Time Clock</p>
  </div>

  <div class="container">
   <!-- Employee Setup -->
<div id="employeeSetup" style="display:block !important; opacity:1 !important; visibility:visible !important; background:white; padding:32px; border-radius:20px; box-shadow:0 8px 30px rgba(0,0,0,0.1); text-align:center; border:2px solid rgba(205, 153, 52, 0.2);">
  <h3 style="color:#cd9934; margin-bottom:12px; font-size:22px;">👋 Welcome!</h3>
  <p style="color:#666; margin-bottom:16px;">Select your name to get started</p>
  <p style="font-size:13px; color:#999; margin-bottom:16px;">You only need to do this once</p>
  
  <select id="employeeDropdown" style="width:100%; padding:16px; border:2px solid #e8e8e8; border-radius:14px; font-size:16px; margin-bottom:16px; background:#fafafa; -webkit-appearance:menulist; appearance:menulist;">
    <option value="">-- Select your name --</option>
  </select>
  
  <button onclick="window.appFunctions.saveEmployeeSelection()" style="width:100%; padding:16px; background:linear-gradient(135deg, #cd9934 0%, #daa842 100%); color:white; border:none; border-radius:14px; font-weight:600; cursor:pointer; font-size:17px;">💛 Continue</button>
</div>
    <!-- Main App -->
    <div id="mainApp" style="display:none;">
      <div id="offlineBadge" style="display:none;" class="offline-badge">
        📴 No Internet Connection
      </div>

      <div class="employee-badge">
        <h3 id="employeeName">Loading...</h3>
        <p id="employeeRole"></p>
        <button onclick="window.appFunctions.changeEmployee()">Not you? Switch employee</button>
      </div>

      <div id="timeDisplay">--:--:--</div>
      <div id="status" class="warn"><span class="loading"></span> Loading…</div>

      <div class="card">
        <input type="hidden" id="employee" />
        <input type="hidden" id="employeeEmail" />

        <label>🏠 Select Client</label>
        <div class="input-wrapper">
          <select id="client"></select>
          <button class="clientInfoBtn" onclick="window.appFunctions.showClientInfo()">ℹ️</button>
        </div>

        <label>💼 Your Role (optional)</label>
        <input id="role" placeholder="RN, LPN, CNA, Caregiver…">

        <label>🚗 Miles Driven</label>
        <input id="mileage" type="number" min="0" step="0.1" placeholder="e.g. 12.5">

        <label>📝 Visit Notes (optional)</label>
        <textarea id="note" rows="2" placeholder="Any notes..."></textarea>

        <button class="clockInBtn" onclick="submitClock('Clock In')">⏱️ Clock In</button>
        <button class="clockOutBtn" onclick="submitClock('Clock Out')">🏁 Clock Out</button>
        <button class="myTimesBtn" onclick="window.location.href='my-times.html'">📊 View My Hours</button>
      </div>

      <div style="text-align:center; font-size:12px; color:#999; padding:8px;">
        v2.0.1 • SOMD Home Health 💛
      </div>
    </div>
  </div>

  <div id="clientPopup">
    <div class="popupCard">
      <h3 id="clientInfoTitle">📍 Client Info</h3>
      <p id="clientInfoBody"></p>
      <button onclick="window.appFunctions.closeClientInfo()" style="margin-top:20px;width:100%;padding:16px;border-radius:14px;border:none;background:linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);color:white;font-weight:700;">Close</button>
    </div>
  </div>

  <!-- ✅ Load app.js FIRST so functions are available -->
  <script src="app.js"></script>

  <!-- ✅ Then run page-specific code -->
  <script>
    // Create namespace for app functions to avoid global pollution
    window.appFunctions = window.appFunctions || {};

    let currentEmployee = null;

    function checkUserSetup() {
      const savedEmployeeName = localStorage.getItem('selectedEmployee');
      
      if (!savedEmployeeName) {
        document.getElementById('employeeSetup').style.display = 'block';
        document.getElementById('mainApp').style.display = 'none';
        loadMetaThenPopulateSetup();
      } else {
        document.getElementById('employeeSetup').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        loadEmployeeByName(savedEmployeeName);
      }
    }

    async function loadMetaThenPopulateSetup() {
      console.log('🔄 Loading meta for employee setup...');
      
      // Wait for meta to load from app.js
      let attempts = 0;
      while (!window.meta && attempts < 20) {
        await new Promise(resolve => setTimeout(resolve, 500));
        attempts++;
      }
      
      // If still no meta, try to load it
      if (!window.meta) {
        console.log('⚠️ Meta not loaded, attempting to load...');
        if (typeof loadMeta === 'function') {
          await loadMeta();
        }
      }

      // Check one more time
      if (!window.meta || !window.meta.employees) {
        console.error('❌ Unable to load employee data');
        if (typeof setStatus === 'function') {
          setStatus('❌ Unable to load employee data. Please refresh.', 'err');
        }
        return;
      }

      console.log('✅ Meta loaded:', window.meta);
      
      const dropdown = document.getElementById('employeeDropdown');
      dropdown.innerHTML = '<option value="">-- Select your name --</option>';
      
      window.meta.employees.forEach(emp => {
        console.log('Adding employee:', emp);
        const option = document.createElement('option');
        
        // ✅ Store ALL the data we need in data attributes
        option.value = emp.fullName;              // Full name for display
        option.textContent = emp.fullName;        // What shows in dropdown
        option.dataset.shortName = emp.name;      // Short name (e.g., "Cheyenne A.")
        option.dataset.fullName = emp.fullName;   // Full name for reference
        option.dataset.email = emp.email || '';   // Work email from Column C
        option.dataset.role = emp.role || '';     // Position/role
        
        dropdown.appendChild(option);
      });

      console.log('✅ Dropdown populated with', window.meta.employees.length, 'employees');
    }

    window.appFunctions.saveEmployeeSelection = function() {
      const dropdown = document.getElementById('employeeDropdown');
      const selectedOption = dropdown.options[dropdown.selectedIndex];
      
      if (!selectedOption || !selectedOption.value) {
        alert('Please select your name');
        return;
      }

      console.log('💾 Saving employee selection:', selectedOption);
      
      // ✅ Get ALL the data from the option's dataset
      const employeeData = {
        fullName: selectedOption.dataset.fullName || selectedOption.value,
        shortName: selectedOption.dataset.shortName || selectedOption.value,
        email: (selectedOption.dataset.email || '').trim().toLowerCase(),
        role: selectedOption.dataset.role || ''
      };

      console.log('💾 Employee data to save:', employeeData);

      // Validate we have the critical data
      if (!employeeData.shortName) {
        console.error('❌ Missing short name!');
        alert('Error: Missing employee data. Please refresh the page and try again.');
        return;
      }

      // Save to localStorage
      localStorage.setItem('selectedEmployee', employeeData.fullName);
      localStorage.setItem('employeeData', JSON.stringify(employeeData));
      
      // ✅ CRITICAL: Save email for My Times page
      if (employeeData.email) {
        localStorage.setItem('userEmail', employeeData.email);
        console.log('✅ Saved userEmail for My Times:', employeeData.email);
      }
      
      console.log('✅ Employee selection saved');
      
      // Switch to main app
      document.getElementById('employeeSetup').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      loadEmployeeByName(employeeData.fullName);
    };

    async function loadEmployeeByName(fullName) {
      console.log('📂 Loading employee by name:', fullName);
      
      const stored = localStorage.getItem('employeeData');
      let employeeData = stored ? JSON.parse(stored) : null;
      
      if (employeeData) {
        console.log('✅ Employee data loaded:', employeeData);
        currentEmployee = employeeData;
        
        // Update the display
        document.getElementById('employeeName').textContent = '👤 ' + employeeData.fullName;
        document.getElementById('employeeRole').textContent = employeeData.role || 'Caregiver';
        
        // ✅ Set the hidden form fields with SHORT NAME (what the server expects)
        document.getElementById('employee').value = employeeData.shortName;
        document.getElementById('employeeEmail').value = employeeData.email;
        document.getElementById('role').value = employeeData.role || '';
        
        console.log('✅ Form fields set:', {
          employee: employeeData.shortName,
          email: employeeData.email,
          role: employeeData.role
        });
        
        if (typeof setStatus === 'function') {
          setStatus(`👋 Welcome, ${employeeData.fullName.split(' ')[0]}!`, 'ok');
        }
      } else {
        console.warn('⚠️ No employee data found in localStorage');
        if (typeof setStatus === 'function') {
          setStatus('⚠️ Please select your name', 'warn');
        }
      }
    }

    window.appFunctions.changeEmployee = function() {
      if (confirm('Switch employee? This will clear your selection.')) {
        console.log('🔄 Clearing employee data');
        localStorage.removeItem('selectedEmployee');
        localStorage.removeItem('employeeData');
        currentEmployee = null;
        document.getElementById('employeeSetup').style.display = 'block';
        document.getElementById('mainApp').style.display = 'none';
        loadMetaThenPopulateSetup();
      }
    };

    window.appFunctions.showClientInfo = function() {
      const cliSel = document.getElementById('client');
      const clientName = cliSel.value;
      
      if (!clientName) {
        alert('Please select a client first');
        return;
      }
      
      if (!window.meta || !window.meta.clients) {
        alert('Client information not available');
        return;
      }
      
      const client = window.meta.clients.find(c => c.name === clientName);
      if (!client) {
        alert('Client information not found');
        return;
      }

      document.getElementById('clientInfoTitle').textContent = '📍 ' + client.name;
      document.getElementById('clientInfoBody').innerHTML =
        `<strong>Address:</strong> ${client.address || 'No address on file'}<br><br>` +
        `<strong>Notes:</strong><br>${client.notes || 'No notes'}`;

      document.getElementById('clientPopup').style.display = 'flex';
    };

    window.appFunctions.closeClientInfo = function() {
      document.getElementById('clientPopup').style.display = 'none';
    };

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      console.log('🚀 App starting...');
      checkUserSetup();
    });

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(reg => {
          console.log('✅ Service Worker registered');
          return reg.update();
        })
        .catch(err => console.error('❌ Service Worker registration failed:', err));
    }
  </script>
</body>
</html>
